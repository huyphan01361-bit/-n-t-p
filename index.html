<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Ôn Tập CNXHKH - VGU</title>
    <style>
        /* Tối ưu hóa cho mọi màn hình */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            padding: 10px; /* Giảm padding để tận dụng diện tích màn hình đt */
            margin: 0;
        }
        .quiz-container { 
            background: white; 
            width: 100%; 
            max-width: 750px; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            box-sizing: border-box; /* Đảm bảo padding không làm tràn màn hình */
        }
        .header h2 { 
            font-size: 1.2em; /* Thu nhỏ tiêu đề một chút trên đt */
            color: #1a5276; 
            margin: 0;
        }
        .header {
            border-bottom: 2px solid #3498db;
            margin-bottom: 15px;
            padding-bottom: 10px;
            text-align: center;
        }
        .question { 
            font-size: 1.1em; 
            font-weight: 600; 
            color: #2c3e50; 
            margin-bottom: 15px; 
            line-height: 1.4; 
        }
        .option-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; /* Tăng độ dày nút để dễ bấm bằng tay */
            margin: 10px 0; 
            border: 1px solid #d5dbdb; 
            border-radius: 8px; 
            background: #fff; 
            cursor: pointer; 
            text-align: left; 
            font-size: 1em; 
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent; /* Xóa vệt đen khi bấm trên đt */
        }
        .correct { background: #2ecc71 !important; color: white; border-color: #27ae60 !important; }
        .wrong { background: #e74c3c !important; color: white; border-color: #c0392b !important; }
        
        .footer { 
            margin-top: 20px; 
            display: flex; 
            flex-wrap: wrap; /* Cho phép các nút xuống dòng nếu màn hình quá hẹp */
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid #eee; 
            padding-top: 15px;
            gap: 8px;
        }
        
        #progress { width: 100%; text-align: center; font-size: 0.85em; margin-bottom: 10px; color: #7f8c8d; }

        button { 
            flex: 1; /* Các nút sẽ chia đều không gian */
            min-width: 80px; 
            padding: 12px 5px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.9em;
        }
        #next-btn { background: #3498db; color: white; }
        #prev-btn { background: #f39c12; color: white; }
        #end-btn { background: #95a5a6; color: white; }
        button:disabled { background: #bdc3c7 !important; }

        #status { font-weight: bold; min-height: 24px; text-align: center; margin-bottom: 10px; }
        .review-mode-active { border: 3px solid #e67e22; }
    </style>
</head>
<body>

<div class="quiz-container" id="main-container">
    <div class="header"><h2>Chủ nghĩa xã hội khoa học</h2></div>
    <div id="progress">Đang tải...</div>
    <div id="status"></div>
    <div id="question-text" class="question"></div>
    <div id="options-container"></div>
    <div class="footer">
        <button id="prev-btn" onclick="prevQuestion()" disabled>Quay lại</button>
        <button id="end-btn" onclick="finishQuiz()">Kết thúc</button>
        <button id="next-btn" onclick="nextQuestion()" disabled>Tiếp theo</button>
    </div>
</div>
<script>
    // DỮ LIỆU SẼ DÁN VÀO ĐÂY
    const quizData = [
        {
            q: "Trong phạm vi môn học, chủ nghĩa xã hội khoa học được nghiên cứu theo gốc độ nào?",
            options: [
                "Lý luận nghiên cứu chủ nghĩa Mác",
                "Lý luận về sự phát triển của các hình thái kinh tế xã hội",
                "Chủ nghĩa Mác - Lênin",
                "Một trong ba bộ phận hợp thành chủ nghĩa Mác – Lênin"
            ],
            correct: 3 // Đáp án D [cite: 1, 5]
        },
        {
            q: "Nền sản xuất đại công nghiệp và phương thức sản xuất tiên tiến đã rèn luyện cho giai cấp công nhân phẩm chất đặc biệt là:",
            options: [
                "Tính tổ chức",
                "Tính cần cù",
                "Tính siêng năng",
                "Tính tự chịu trách nhiệm"
            ],
            correct: 0 // Đáp án A [cite: 6, 8]
        },
        {
            q: "Nền sản xuất đại công nghiệp và phương thức sản xuất tiên tiến đã rèn luyện cho giai cấp công nhân phẩm chất đặc biệt là (về kỷ luật):",
            options: [
                "Kỷ luật lao động",
                "Tính cầu tiến",
                "Tính siêng năng",
                "Tính tự chịu trách nhiệm"
            ],
            correct: 0 // Đáp án A [cite: 12, 13]
        },
        {
            q: "Ở các nước tư bản chủ nghĩa, lực lượng không có hoặc về cơ bản không có tư liệu sản xuất phải làm thuê cho giai cấp tư sản và bị giai cấp tư sản bóc lột giá trị thặng dư là:",
            options: [
                "Nhân dân lao động",
                "Giai cấp nông dân",
                "Tầng lớp tiểu tư sản",
                "Giai cấp công nhân"
            ],
            correct: 3 // Đáp án D [cite: 17, 22]
        },
        {
            q: "Lực lượng có mâu thuẫn trực tiếp với giai cấp tư sản trong phương thức sản xuất tư bản chủ nghĩa là:",
            options: [
                "Công nhân",
                "Tư sản",
                "Tiểu tư sản",
                "Nông dân"
            ],
            correct: 0 // Đáp án A [cite: 23, 25]
        },
        {
            q: "Nội dung sứ mệnh lịch sử của giai cấp công nhân về văn hóa, tư tưởng là:",
            options: [
                "Xây dựng nền dân chủ xã hội chủ nghĩa",
                "Tạo tiền đề vật chất - kỹ thuật cho sự ra đời của xã hội mới",
                "Xây dựng nền văn hóa tiến bộ, hiện đại, văn minh",
                "Xây dựng và củng cố ý thức hệ tiên tiến của giai cấp công nhân"
            ],
            correct: 3 // Đáp án D [cite: 29, 33]
        },
        {
            q: "Phẩm chất tiêu biểu của giai cấp công nhân với tư cách là một giai cấp tiên tiến, cách mạng là:",
            options: [
                "Tính cần cù",
                "Tính độc lập",
                "Tính quyết đoán",
                "Tính tổ chức và kỷ luật"
            ],
            correct: 3 // Đáp án D [cite: 34, 38]
        },
{
            q: "Phạm trù nào được coi là cơ bản nhất, là xuất phát điểm trong học phần chủ nghĩa xã hội khoa học?",
            options: [
                "Giai cấp công nhân và giai cấp nông dân",
                "Sứ mệnh lịch sử của giai cấp công nhân",
                "Chuyên chính vô sản",
                "Chủ nghĩa cộng sản"
            ],
            correct: 1 // Đáp án B
        },
        {
            q: "Từ chủ nghĩa tư bản lên chủ nghĩa xã hội có cần phải trải qua thời kỳ quá độ không?",
            options: [
                "Tùy vào chế độ chính trị của mỗi nước",
                "Tùy vào trình độ phát triển của mỗi nước",
                "Tất yếu phải trải qua thời kỳ quá độ",
                "Tùy vào sự định hướng của Đảng cầm quyền"
            ],
            correct: 2 // Đáp án C
        },
        {
            q: "Những nước nào sau đây sẽ quá độ trực tiếp lên chủ nghĩa xã hội?",
            options: [
                "Những nước chưa trải qua chủ nghĩa tư bản phát triển",
                "Những nước tiền tư bản chủ nghĩa",
                "Những nước đã trải qua chủ nghĩa tư bản phát triển",
                "Những nước ở Đông Âu"
            ],
            correct: 2 // Đáp án C
        },
        {
            q: "Hình thức quá độ của các nước như Trung Quốc, Triều Tiên và Việt Nam là:",
            options: [
                "Quá độ tuần tự",
                "Quá độ nhảy vọt",
                "Quá độ trực tiếp",
                "Quá độ gián tiếp"
            ],
            correct: 3 // Đáp án D
        },
        {
            q: "“Xã hội có sự đan xen của nhiều tàn dư về mọi phương diện kinh tế, đạo đức, tinh thần của chủ nghĩa tư bản và những yếu tố mới mang tính chất xã hội chủ nghĩa mới phát sinh”. Đặc điểm này nằm trong giai đoạn nào của hình thái kinh tế - xã hội cộng sản chủ nghĩa?",
            options: [
                "Thời kỳ củng cố chính quyền cũ",
                "Thời kỳ đấu tranh giành chính quyền",
                "Thời kỳ quá độ lên chủ nghĩa xã hội",
                "Thời kỳ xây dựng chính quyền mới"
            ],
            correct: 2 // Đáp án C
        },
        {
            q: "Khái niệm dùng để chỉ một chế độ xã hội tốt đẹp, giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa là:",
            options: [
                "Thời kỳ chuyển tiếp",
                "Chủ nghĩa xã hội",
                "Thời kỳ quá độ lên chủ nghĩa xã hội",
                "Chủ nghĩa cộng sản"
            ],
            correct: 1 // Đáp án B
        },
        {
            q: "Đặc điểm về phương diện tư tưởng – văn hóa của thời kỳ quá độ lên chủ nghĩa xã hội là:",
            options: [
                "Tồn tại nền kinh tế nhiều thành phần, trong đó có thành phần đối lập",
                "Thiết lập, tăng cường chuyên chính vô sản",
                "Tồn tại nhiều tư tưởng khác nhau, chủ yếu là tư tưởng vô sản và tư tưởng tư sản",
                "Tồn tại nhiều giai cấp, tầng lớp và sự khác biệt giữa các giai cấp tầng lớp xã hội"
            ],
            correct: 2 // Đáp án C
        },

{
            q: "Chức năng của nhà nước xã hội chủ nghĩa ở Việt Nam hiện nay là:",
            options: [
                "Đoàn kết các giai cấp, tầng lớp trong xã hội để xây dựng chủ nghĩa xã hội",
                "Đoàn kết các dân tộc và trấn áp những lực lượng chống phá sự nghiệp xây dựng chủ nghĩa xã hội của nhân dân",
                "Tổ chức xây dựng chủ nghĩa xã hội và trấn áp những lực lượng chống phá sự nghiệp xây dựng chủ nghĩa xã hội của nhân dân",
                "Tổ chức, quản lý nền sản xuất xã hội chủ nghĩa"
            ],
            correct: 2 // Đáp án C
        },
        {
            q: "Đặc điểm thể hiện bản chất của Nhà nước xã hội chủ nghĩa kiểu mới ở Việt Nam hiện nay là:",
            options: [
                "Nhà nước ra đời muộn nhất",
                "Nhà nước vì nhân dân",
                "Nhà nước có bản chất khác với bản chất của các kiểu nhà nước bóc lột trong lịch sử",
                "Nhà nước dựa trên nhiều hình thức sở hữu về tư liệu sản xuất"
            ],
            correct: 2 // Đáp án C
        },
        {
            q: "Nguyên nhân sâu xa làm cho dân chủ nguyên thủy bị thay thế bằng nền dân chủ chủ nô là:",
            options: [
                "Sự phát triển của quan hệ sản xuất đòi hỏi phải có một lực lượng sản xuất phù hợp",
                "Sự phát triển của lực lượng sản xuất đòi hỏi phải có một quan hệ sản xuất phù hợp",
                "Sự ra đời, tồn tại và phát triển của các hình thái ý thức xã hội",
                "Sự ra đời của các hình thức sở hữu"
            ],
            correct: 1 // Đáp án B
        },
        {
            q: "Nhiệm vụ có ý nghĩa tiên quyết đối với việc xây dựng và hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam hiện nay là:",
            options: [
                "Đẩy mạnh tuyên truyền, phổ biến, giáo dục, nâng cao nhận thức về Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam",
                "Ý thức tự giác, tinh thần trách nhiệm của người dân",
                "Người dân có điều kiện phát triển toàn diện",
                "Xây dựng được hệ thống pháp luật chặt chẽ, nghiêm minh"
            ],
            correct: 0 // Đáp án A
        },
        {
            q: "Đặc điểm cơ bản của nền dân chủ xã hội chủ nghĩa ở Việt Nam hiện nay là:",
            options: [
                "Nền dân chủ không mang tính giai cấp",
                "Nền dân chủ của tất cả mọi người",
                "Nền dân chủ của giai cấp công nhân, giai cấp nông dân và đội ngũ trí thức",
                "Nền dân chủ rộng rãi cho nhân dân lao động"
            ],
            correct: 3 // Đáp án D
        },
        {
            q: "Thiết chế nào được xem là “trụ cột” của nhân dân Việt Nam hiện nay trong sự nghiệp xây dựng và bảo vệ Tổ quốc?",
            options: [
                "Đảng Cộng sản Việt Nam",
                "Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam",
                "Hội đồng nhân dân các cấp",
                "Các tổ chức đoàn thể"
            ],
            correct: 1 // Đáp án B
        },
{
            q: "Những yếu tố nào dùng để đo lường chất lượng dân chủ của một quốc gia?",
            options: [
                "Dân được biết, dân được bàn, dân được kiểm tra, dân được giám sát",
                "Trình độ dân trí được nâng cao",
                "Nâng cao đời sống vật chất và tinh thần cho nhân dân",
                "Ý thức trách nhiệm của người dân đối với pháp luật"
            ],
            correct: 0 // Đáp án A [cite: 41]
        },
        {
            q: "Nguyên nhân cơ bản dẫn đến sự biến đổi không ngừng của cơ cấu xã hội – giai cấp trong thời kỳ hiện đại là:",
            options: [
                "Phương thức sản xuất",
                "Tư liệu sản xuất",
                "Quan hệ sản xuất",
                "Kiến trúc thượng tầng"
            ],
            correct: 0 // Đáp án A [cite: 41]
        },
        {
            q: "Theo quan điểm của chủ nghĩa Mác – Lênin, giai cấp nào là lực lượng chính trị – xã hội chủ yếu trong thời kỳ quá độ lên chủ nghĩa xã hội?",
            options: [
                "Đội ngũ trí thức",
                "Đội ngũ doanh nhân",
                "Giai cấp nông dân",
                "Giai cấp công nhân"
            ],
            correct: 3 // Đáp án D [cite: 41]
        },
        {
            q: "Mối quan hệ cơ bản phản ánh sự tồn tại của cơ cấu xã hội – giai cấp là:",
            options: [
                "Mối quan hệ về cung cầu, về sản xuất và tiêu dùng, về sản xuất và tái sản xuất",
                "Mối quan hệ về sở hữu tư liệu sản xuất, về sản xuất và tiêu dùng, về sản xuất và tái sản xuất",
                "Mối quan hệ về sở hữu tư liệu sản xuất, về tổ chức quản lý quá trình sản xuất, về sản xuất và tiêu dùng",
                "Mối quan hệ về sở hữu tư liệu sản xuất, về tổ chức quản lý quá trình sản xuất, về phân phối thu nhập"
            ],
            correct: 3 // Đáp án D [cite: 41]
        },
        {
            q: "Lực lượng tiên phong trong xây dựng chủ nghĩa xã hội và công nghiệp hóa, hiện đại hóa đất nước ở Việt Nam hiện nay là:",
            options: [
                "Tầng lớp trí thức",
                "Đội ngũ doanh nhân",
                "Đội ngũ thanh niên",
                "Giai cấp công nhân"
            ],
            correct: 3 // Đáp án D [cite: 41]
        },
        {
            q: "Yếu tố quyết định mức độ liên minh giữa các giai cấp, tầng lớp trong thời kỳ quá độ lên chủ nghĩa xã hội là:",
            options: [
                "Chính trị - xã hội",
                "Kinh tế – xã hội",
                "Khoa học – công nghệ",
                "Đường lối, chính sách của giai cấp cầm quyền"
            ],
            correct: 1 // Đáp án B [cite: 41]
        },
        {
            q: "Một trong những đặc trưng cơ bản của sự hình thành các dân tộc trong lịch sử là:",
            options: [
                "Có chung điều kiện tự nhiên",
                "Có chung phong tục, tập quán",
                "Có chung ý thức, lịch sử, văn hóa",
                "Có chung khu vực sinh sống"
            ],
            correct: 2 // Đáp án C [cite: 41]
        },
{
            q: "Nguyên nhân chủ yếu thúc đẩy các dân tộc bị áp bức xích lại gần nhau là:",
            options: [
                "Do sự xâm lược, bành trướng và can thiệp của các nước thực dân, đế quốc",
                "Do chính sách mở cửa, thu hút đầu tư kinh tế",
                "Do phát triển khoa học, giao lưu văn hoá",
                "Do phát triển quốc phòng - an ninh"
            ],
            correct: 0 // Đáp án A [cite: 42]
        },
        {
            q: "Vì sao tôn giáo trong xã hội nguyên thủy không có tính chính trị?",
            options: [
                "Chưa xuất hiện giai cấp và nhà nước",
                "Chưa xuất hiện nhu cầu tôn giáo",
                "Chưa xảy ra xung đột khu vực và lãnh thổ",

            options: [

                "Vì nó là cơ sở cho sự giàu có của các giai cấp, tầng lớp trong xã hội và là yếu tố quan trọng đảm bảo cho các giai cấp, tầng lớp có thể liên minh lâu dài",
                "Vì nó thỏa mãn các nhu cầu, lợi ích kinh tế của các giai cấp, tầng lớp khác trong xã hội và là điều kiện để ổn định chính trị sau chiến tranh"

        {

                "Có, để phòng trừ các phần tử phản động lợi dụng tôn giáo chống phá cách mạng",
                "Không, vì Nhà nước tôn trọng quyền tự do tín ngưỡng của nhân dân",
                "Có, để ngăn chặn sự mâu thuẫn trong nội bộ các tôn giáo"
            ],
            correct: 1 // Đáp án B
        },
{
            q: "Khi cá nhân, tổ chức cấm đoán, ngăn cản, ép buộc hay đe dọa người khác phải theo tôn giáo là:",
            options: [
                "Vi phạm vào Hiến pháp 2013 và Luật tín ngưỡng, tôn giáo 2016 của cá nhân",
                "Vi phạm các giá trị đạo đức và nguyên tắc cộng đồng",
                "Vi phạm vào đức tin của con người",
                "Vi phạm nhân phẩm, danh dự, uy tín cá nhân"
            ],
            correct: 0 // Đáp án A
        },
        {
            q: "Điều kiện nào không góp phần hình thành dân tộc Việt Nam?",
            options: [
                "Do quá trình bành trướng và xâm lược của chủ nghĩa thực dân, đế quốc toàn cầu.",
                "Do chế độ tư hữu về ruộng đất, xã hội phân hóa giai cấp mạnh mẽ",
                "Do yêu cầu phòng chống thiên tai lũ lụt và phát triển sản xuất",
                "Do yêu cầu từ cuộc đấu tranh trường kỳ chống các thế lực ngoại xâm"
            ],
            correct: 1 // Đáp án B
        },
        {
            q: "Quan điểm nào không phản ánh đúng về hôn nhân tiến bộ?",
            options: [
                "Được xây dựng trên cơ sở tình yêu, sự tự nguyện và bình đẳng",
                "Đề cao quyền tự do, hạnh phúc của mỗi cá nhân",
                "Cho phép vợ chồng bình đẳng, tôn trọng và giúp đỡ lẫn nhau",
                "Do sự sắp đặt của gia đình, coi trọng lợi ích dòng họ hơn hạnh phúc cá nhân"
            ],
            correct: 3 // Đáp án D
        },
        {
            q: "Khi tiến đến hôn nhân chỉ cần tổ chức đám cưới không cần đăng ký kết hôn được không? Vì sao?",
            options: [
                "Được, vì đó là quyền tự do hôn nhân",
                "Được, vì pháp luật không bắt buộc nhưng hôn nhân này sẽ không hợp pháp",
                "Không, vì pháp luật bắt buộc",
                "Không, vì như vậy là không hợp pháp và không hợp đạo lý"
            ],
            correct: 2 // Đáp án C
        },
        {
            q: "Ngoài quan hệ huyết thống, gia đình còn được hình thành dựa trên mối quan hệ nào?",
            options: [
                "Cha mẹ nuôi - con nuôi",
                "Ông bà - cháu chắt",
                "Anh chị em ruột",
                "Cô - dì - chú - bác"
            ],
            correct: 0 // Đáp án A
        },
        {
            q: "Để thực hiện tốt chức năng kinh tế và tổ chức đời sống gia đình, sinh viên cần phải có trách nhiệm như thế nào đối với gia đình của mình?",
            options: [
                "Sống tiết kiệm, biết chi tiêu hợp lý, phụ giúp cha mẹ khi có điều kiện",
                "Chi tập trung cho học tập, mọi việc kinh tế và tổ chức đời sống để cha mẹ lo",
                "Biết quan tâm, chia sẻ, cùng cha mẹ sắp xếp công việc gia đình phù hợp khả năng",
                "Tham gia lao động, rèn luyện kỹ năng sống tự lập, không ỷ lại vào gia đình"
            ],
            correct: 0 // Đáp án A
        },
        {
            q: "Nam và nữ cần phải làm gì khi quyết định đi đến hôn nhân nhằm đảm bảo quy định của pháp luật và trách nhiệm xã hội?",
            options: [
                "Đăng ký kết hôn",
                "Ra mắt gia đình",
                "Ra mắt gia đình và dòng họ",
                "Sống chung với nhau"
            ],
            correct: 0 // Đáp án A
        }
    ];
let mainIdx = 0;
    let currentReviewIdx = 0;
    let wrongQuestions = [];
    let sessionCounter = 0;
    let isReviewMode = false;

    // Trộn mảng ngẫu nhiên
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadQuestion() {
        const dataSource = isReviewMode ? wrongQuestions : quizData;
        const activeIdx = isReviewMode ? currentReviewIdx : mainIdx;
        const container = document.getElementById('main-container');

        // Cập nhật trạng thái nút Quay lại
        document.getElementById('prev-btn').disabled = (activeIdx === 0);

        if (activeIdx >= dataSource.length) {
            if (!isReviewMode && wrongQuestions.length > 0) {
                startReview();
                return;
            }
            finishQuiz();
            return;
        }

        const qData = dataSource[activeIdx];
        
        if (isReviewMode) {
            container.classList.add('review-mode-active');
            document.getElementById('question-text').innerHTML = `<span class="review-tag">[ÔN TẬP CÂU SAI]</span> ` + (activeIdx + 1) + ". " + qData.q;
        } else {
            container.classList.remove('review-mode-active');
            document.getElementById('question-text').innerText = (activeIdx + 1) + ". " + qData.q;
        }

        document.getElementById('progress').innerText = isReviewMode 
            ? `Trị câu sai: ${activeIdx + 1} / ${dataSource.length}`
            : `Tiến độ chính: ${activeIdx + 1} / ${quizData.length}`;
            
        document.getElementById('status').innerText = "";
        document.getElementById('next-btn').disabled = true;

        const optionsBox = document.getElementById('options-container');
        optionsBox.innerHTML = '';

        qData.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.className = 'option-btn';
            btn.onclick = () => {
                if (i === qData.correct) {
                    btn.className = 'option-btn correct';
                    document.getElementById('status').innerText = "Đúng rùi! Bé Quỳnh giỏi qué!";
                    document.getElementById('status').style.color = "#27ae60";
                    document.getElementById('next-btn').disabled = false;
                    if (isReviewMode) qData.isNowCorrect = true;
                    Array.from(optionsBox.children).forEach(b => b.onclick = null);
                } else {
                    btn.className = 'option-btn wrong';
                    btn.disabled = true;
                    document.getElementById('status').innerText = "Sai rùi nhó!";
                    document.getElementById('status').style.color = "#e74c3c";
                    if (!wrongQuestions.includes(qData)) { wrongQuestions.push(qData); }
                    if (isReviewMode) qData.isNowCorrect = false;
                }
            };
            optionsBox.appendChild(btn);
        });
    }

    function nextQuestion() {
        if (!isReviewMode) {
            mainIdx++;
            sessionCounter++;
            if (sessionCounter >= 30 && wrongQuestions.length > 0) {
                startReview();
                return;
            }
        } else {
            currentReviewIdx++;
            if (currentReviewIdx >= wrongQuestions.length) {
                wrongQuestions = wrongQuestions.filter(q => q.isNowCorrect !== true);
                isReviewMode = false;
                currentReviewIdx = 0;
            }
        }
        loadQuestion();
    }

    function prevQuestion() {
        if (isReviewMode) {
            if (currentReviewIdx > 0) currentReviewIdx--;
        } else {
            if (mainIdx > 0) mainIdx--;
        }
        loadQuestion();
    }

    function startReview() {
        isReviewMode = true;
        currentReviewIdx = 0;
        sessionCounter = 0;
        wrongQuestions.forEach(q => q.isNowCorrect = false);
        loadQuestion();
    }

    function finishQuiz() {
        document.getElementById('main-container').innerHTML = `
            <div style='text-align:center; padding: 30px;'>
                <h2 style='color:#27ae60'>🎉 Chúc mừng bé Quỳnh nhó!</h2>
                <p>Bé Quỳnh đã vượt qua sóng gió hehe :></p>
                <button onclick='location.reload()'>Quay lại sóng gió</button>
            </div>`;
    }

    // Khởi tạo
    shuffleArray(quizData);
    loadQuestion();
</script>
